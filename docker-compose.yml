services:
    laravel.test:
        build:
            context: ./backend/docker/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '33'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '8080:80'
            - '5173:5173'
        environment:
            WWWUSER: '1000'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: 'off'
            XDEBUG_CONFIG: 'client_host=host.docker.internal'
            IGNITION_LOCAL_SITES_PATH: '/var/www/html'
            NLP_SERVICE_URL: 'http://nlp-service:5000'
        volumes:
            - './backend:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - nlp-service

    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '5433:5432'
        environment:
            PGPASSWORD: 'password'
            POSTGRES_DB: 'centralized_job_placement'
            POSTGRES_USER: 'sail'
            POSTGRES_PASSWORD: 'password'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "pg_isready", "-q", "-d", "centralized_job_placement", "-U", "sail"]
            retries: 3
            timeout: 5s

    nlp-service:
        build:
            context: ./nlp-service
            dockerfile: Dockerfile
        image: nlp-service/app
        ports:
            - '5001:5000'
        volumes:
            - './nlp-service:/app'
            - './backend/storage/app:/shared-storage'
        environment:
            FLASK_ENV: 'development'
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local